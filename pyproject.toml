[project]
name = "autodub"
version = "0.1.0.dev0"
description = "Автодубляж: локальный дубляж видео на русский с клонированием голоса"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [{ name = "Zaxar1231" }]
dependencies = [
    "flet>=1.1,<2",
    "numpy>=2.1",
    "psutil>=7.2",
    "nvidia-ml-py>=13.0",
    "pydantic>=2.11",
    "platformdirs>=4.3",
    "tomli-w>=1.2",
]

[project.scripts]
autodub = "autodub.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.14",
    "mypy>=1.18",
    "types-psutil",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autodub"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Russian UI strings legitimately contain Cyrillic letters that look like Latin ones.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["autodub"]

[[tool.mypy.overrides]]
module = ["pynvml", "flet", "flet.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
